name: Release

# Thin caller: delegates to the shared macOS release pipeline
# (teddychan/dragon-release-ci). Archive + export (Developer ID) via xcodebuild,
# notarize, staple, publish Ice 2, push the Sparkle appcast to docs/ice-2/, and
# bump the Homebrew cask. Triggered by a v* tag on this repo.
#
# Secrets are inherited from this repo's Actions secrets:
#   DEVELOPER_ID_CERT_P12_BASE64, DEVELOPER_ID_CERT_PASSWORD,
#   NOTARY_KEY_P8_BASE64, NOTARY_KEY_ID, NOTARY_ISSUER_ID,
#   PUBLIC_RELEASE_TOKEN, SPARKLE_EDDSA_PRIVATE_KEY
on:
  push:
    tags:
      - 'v*'
  # A verification-only dispatch, the shape dragon-sample-app has had since v6: run the tag gate
  # and an UNSIGNED build, publish nothing. Not the archive — the reusable workflow's verify-only
  # step is `Build (unsigned, no archive) [xcodebuild]`, which deliberately produces nothing
  # signable. It still catches a compile break, a missing resource and a version slip, which is
  # what a build-path change needs. It is the only way to exercise this
  # pipeline from a branch with no tag — which is what a change to the BUILD, rather than to the
  # app, needs. Moving Info.plist to App/ under CONFORMANCE §R16 was exactly such a change: it
  # rewrites INFOPLIST_FILE for both bundles, and nothing else here would have caught a typo in
  # either one until a public tag was already pushed.
  workflow_dispatch:
    inputs:
      verify_only:
        description: 'Run the gate and build, publish nothing'
        type: boolean
        default: true
      release_tag:
        description: 'Optional: an EXISTING exact vX.Y.Z tag to build. The job checks out that commit rather than the branch head. Leave empty to build this branch.'
        type: string
        default: ''

# The reusable release workflow creates the GitHub Release and uploads assets,
# which needs contents: write. This repo's default workflow token is read-only,
# so grant write here or the reusable call is rejected at startup.
permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    uses: teddychan/dragon-release-ci/.github/workflows/release-macos.yml@v6
    secrets: inherit
    with:
      # `inputs` only exists for workflow_dispatch. On a TAG PUSH it is absent, so a bare
      # `${{ inputs.verify_only }}` evaluates to '' and GitHub rejects the whole run with
      # "evaluate reusable workflow inputs … Unexpected value ''" — 0 jobs, no log, and a public
      # tag spent for nothing. dragon-sample-app burned v1.4.1 on exactly that. Guard on the event
      # so a push resolves to a literal false.
      verify_only: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_only || false }}
      release_tag: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || '' }}
      # v6's tag gate replaces v5's `VERSION=${TAG##*v}`, which left a value containing no "v"
      # untouched — so a workflow_dispatch arrived with a BRANCH ref and produced VERSION=main.
      # It also accepts only exact `vX.Y.Z`, and requires whats_new_path: the two move together,
      # because passing whats_new_path to v5 fails at startup (v5 does not define the input) and
      # omitting it on v6 fails the gate.
      #
      # The config file FIRST — the version and section checks read that one — then every
      # translation. Ice 2's entries used to be raw Swift string literals, and this input named
      # that one file; as of v2.15.0 they are abstract `L()` keys
      # ("app.whatsNew.summary"), so the text a user actually reads lives in these
      # .strings and the .swift can sit still through a complete rewrite of the notes. Watching
      # only the .swift would reject that real rewrite and wave through a release whose notes
      # never changed. Needs dragon-release-ci >= v6.2.0, which is what made the input accept a
      # list. Matches how spectacle-2 and yahoo-keykey-2 already declare theirs.
      #
      # ALL SEVEN locales, not just en. A list naming only English would let a release rewrite the
      # notes there and ship the previous version's text to Spanish, French, Japanese, Korean and
      # both Chinese readers — the exact staleness this gate exists to catch, narrowed to the
      # languages nobody cutting the release would be reading. Add a line here with every new
      # .lproj.
      whats_new_path: >-
        Ice/Settings/WhatsNewConfig.swift
        Ice/Resources/en.lproj/Localizable.strings
        Ice/Resources/es.lproj/Localizable.strings
        Ice/Resources/fr.lproj/Localizable.strings
        Ice/Resources/ja.lproj/Localizable.strings
        Ice/Resources/ko.lproj/Localizable.strings
        Ice/Resources/zh-Hans.lproj/Localizable.strings
        Ice/Resources/zh-Hant.lproj/Localizable.strings
      build_kind: xcodebuild
      # Ice 2 targets the macOS 26 SDK, so build on a macos-26 runner (the
      # default macos-15 image lacks the SDK). This input drives the job's
      # runs-on for all build kinds, not just swiftpm.
      swiftpm_runner: macos-26
      app_slug: ice-2
      # Moving the appcast off the marketing site. DONE as of v2.15.0 — the mirror is retired and
      # this app's update feed now lives only in this repository.
      #
      # MAC-APP-RELEASE-LIFECYCLE.md: "Sparkle appcasts are update infrastructure, not marketing
      # content. Each app should host its production appcast in its own repository so an outage,
      # permission problem, or rejected change in the marketing-site repository cannot interfere
      # with update delivery." This caller used to pass no appcast_repo at all and so took the
      # default, teddychan/www.dragonapp.com. spectacle-2, dragon-sample-app and clipmenu-2 had
      # already migrated; yahoo-keykey-2 has not.
      #
      # The same spec says to migrate "by mirroring the old and new locations until installed
      # versions have moved to the app-owned URL", which is why this was two releases and not one.
      # Every Ice 2 installed at the time read SUFeedURL from the site, so flipping the destination
      # alone would have left all of them silently unable to see updates.
      #
      #   step 1  v2.14.3  published to BOTH, with Ice/Resources/Info.plist still pointing at the
      #                    site, so nothing changed for anyone — but the app-owned feed came into
      #                    existence and was current. Both copies verified byte-identical after.
      #   step 2  v2.14.4  SUFeedURL moved to
      #                    https://raw.githubusercontent.com/teddychan/ice-2/main/docs/ice-2/appcast.xml
      #   step 3  v2.15.0  appcast_mirror_repo dropped — this release. Ice 2's production feed is
      #                    now published to this repository only.
      #
      # That trigger was chosen on 2026-08-11, replacing "when no supported version still reads
      # the site" — which read like a rule but named no measurable condition, so it would have
      # stayed "later" indefinitely. The site is GitHub Pages and exposes no per-path traffic, so
      # there is no way to observe when the last reader stops reading. A minor release is instead a
      # real, deliberate event that already opens a PR here, so the removal rides one rather than
      # needing its own; and Sparkle checks daily by default, so anyone who launches Ice 2 even
      # once between 2.14.4 and that release has already moved to the app-owned feed.
      #
      # The mirror was not dropped before this point. Every copy still at 2.14.3 or older reads the
      # site and only the site; the mirror is the whole reason flipping SUFeedURL did not strand
      # them. The accepted cost was the other direction: shipping no minor for a long time would
      # have kept the mirror that long. That is the safe way to be wrong — an unnecessary mirror
      # costs one extra publish per release, while a premature drop silently strands installs that
      # cannot tell the difference between "no update" and "feed gone".
      #
      # What this means from now on: www.dragonapp.com/ice-2/appcast.xml stops being updated and
      # goes stale at v2.14.7. It is deliberately left in place rather than deleted — a stale feed
      # offers an old version to anything still reading it, which is recoverable; a 404 is not.
      #
      # Needs dragon-release-ci >= v6.3.0. Publishing to this repo uses the built-in GITHUB_TOKEN
      # (contents: write is granted above), so the release no longer depends on
      # PUBLIC_RELEASE_TOKEN reaching the marketing-site repo at all — that token is still
      # inherited, but now only the Homebrew cask bump uses it.
      #
      # Ice 2 is the first xcodebuild-built app to use this: generate_appcast is located under the
      # derived-data SourcePackages artifacts (generate_appcast_glob: xcodebuild, below) rather
      # than a SwiftPM .build directory. That lookup is unchanged and already runs on every
      # release — only the publish destinations move.
      appcast_repo: teddychan/ice-2-macos
      release_title_prefix: Ice 2
      bot_name: Ice 2 Release Bot
      xcode_project: Ice.xcodeproj
      xcode_scheme: Ice
      xcode_export_options: .github/release/exportOptions.plist
      xcode_development_team: 4AF3KGGV29
      # Fail the release (before notarization) if the tag doesn't match the
      # exported app's CFBundleShortVersionString — i.e. the Ice target's
      # MARKETING_VERSION in Ice.xcodeproj. Guards against tagging vX.Y.Z without
      # bumping the project, which would ship an app reporting the old version and
      # put a stale version in the Sparkle appcast.
      assert_tag_matches_plist: true
      zip_name_template: 'Ice-2-{TAG}.zip'
      zip_keep_parent: true
      generate_appcast_glob: xcodebuild
